[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiring-harness"
version = "0.1.0"
description = "Shared Caddy, mTLS, and DNS provisioning for the home server portfolio."
license = { text = "MIT" }
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff", "black", "pytest"]

# This repo ships scripts and config, not an importable package. Declaring no
# modules keeps `pip install -e ".[dev]"` working so CI can install the test
# tooling without inventing a package layout.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 120
target-version = ["py311"]
